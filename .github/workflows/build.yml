name: Build APK (Cloud 4-Core 16GB)

on:
  workflow_dispatch: # 允许在网页上手动点击按钮运行
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest # 白嫖 GitHub 的 4核 16G 服务器

    steps:
      - name: 1. 拉取源码
        uses: actions/checkout@v4

      - name: 2. 安装 JDK 21 (项目硬性要求)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. 配置 Android SDK 并补齐组件
        uses: android-actions/setup-android@v3
        
      - name: 4. 安装 CMake 和 SDK 37 (防报错)
        run: |
          sdkmanager --install "cmake;3.22.1" "platforms;android-37" "build-tools;34.0.0" || true
          # 如果官方源没更新 37，尝试装 37.0 并做软链接欺骗 Gradle
          sdkmanager --install "platforms;android-37.0" || true
          ln -s $ANDROID_HOME/platforms/android-37.0 $ANDROID_HOME/platforms/android-37 2>/dev/null || true

      - name: 4.5. 编译 unblocker 静态二进制
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* | head -1)
          CLANG=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
          $CLANG --target=aarch64-linux-android35 -static -O2 -s unblocker.c -o app/src/main/assets/unblocker
          chmod 755 app/src/main/assets/unblocker

      - name: 5. 赋予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 6. 开始云端编译 (AGP会自动下载所需的 NDK)
        run: ./gradlew assembleDebug --no-daemon

      - name: 7. 上传编译好的 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: Root-My-Galaxy-Local-APK
          path: app/build/outputs/apk/debug/app-debug.apk
